name: Build Render Heartbeat Plugin

on:
  push:
    paths:
      - 'server-plugin/**'
      - '.github/workflows/build-render-heartbeat-plugin.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build plugin
        working-directory: server-plugin
        run: gradle build --no-daemon
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: zoimc-render-heartbeat
          path: server-plugin/build/libs/*.jar
          if-no-files-found: error
